name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install deps
        run: |
          npm install -g npm@11
          # 防止 lockfile 引入内网镜像 URL（历史上多次发生）
          find . -name package-lock.json -not -path "*/node_modules/*" -exec sed -i 's|http://mirrors.tencentyun.com/npm|https://registry.npmjs.org|g' {} \;
          npm install --no-audit --no-fund
      - name: Install mobile deps
        working-directory: clients/mobile
        run: npm install --no-audit --no-fund

      - name: Capacitor sync
        working-directory: clients/mobile
        run: |
          npm run build
          npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Build APK
        working-directory: clients/mobile/android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: maodou-notes-debug-apk
          path: clients/mobile/android/app/build/outputs/apk/debug/*.apk
